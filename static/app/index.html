<!-- Technical Implementation Plan 2.c.iii — bot-protection widget on the
     registration forms. render=explicit + onload=onHcaptchaLoaded because
     the registration forms this widget lives in don't exist in the DOM
     until a user switches tabs, well after this script has already run its
     one-time automatic scan — hCaptcha's script does NOT keep watching for
     elements added later, so implicit/automatic mode would silently never
     render anything for a form that appears after page load.
     onHcaptchaLoaded is defined here, in a plain classic script, rather
     than inside main.js's ES module: module scripts are deferred, and the
     async hCaptcha script below can finish loading and try to call
     window.onHcaptchaLoaded before a deferred module has had a chance to
     define it — a real race that silently dropped every render() call
     until caught by an actual browser test. Sets a flag plus fires an
     event so main.js can pick this up whichever order the two actually
     finish loading in. -->
<script>
  window.onHcaptchaLoaded = function () {
    window.__hcaptchaReady = true;
    document.dispatchEvent(new Event("hcaptcha-ready"));
  };
</script>
<script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoaded&render=explicit" async defer></script>
</head>
