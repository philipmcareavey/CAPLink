name: CI

# Technical Implementation Plan step 1.b.i: lint, type-check, and test on
# every pull request (and on main, as a safety net for direct pushes/merges
# that skip a PR). Three independent jobs, not one job with three steps, so
# they run in parallel and a lint failure doesn't block seeing the mypy/test
# results too.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mypy app/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v

  sast:
    # Technical Implementation Plan step 8.c.i — automated SAST
    # (bandit) and dependency vulnerability scanning (pip-audit) on every
    # push/PR, same as lint/typecheck/test above. bandit's config (see
    # pyproject.toml's [tool.bandit]) skips B101 (assert_used) project-wide
    # — this codebase's ~40 documented `assert x is not None, "<why>"`
    # invariant guards aren't the "asserts vanish under python -O" risk
    # that rule warns about — everything else must pass clean, not be
    # suppressed. pip-audit fails the build on any *fixable* CVE; ecdsa's
    # known, wontfix-by-upstream Minerva timing attack (PYSEC-2026-1325) is
    # explicitly ignored here because CAPLink's JWTs are always signed
    # HS256 (see app/core/config.py's ALGORITHM setting) — the vulnerable
    # ECDSA-signing code path in python-jose's ecdsa dependency is never
    # actually exercised. Revisit this ignore if ALGORITHM ever changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-integrations.txt -r requirements-dev.txt
      - run: bandit -c pyproject.toml -r app/ scripts/
      - run: >
          pip-audit -r requirements.txt -r requirements-dev.txt
          -r requirements-integrations.txt -r requirements-postgres.txt
          --ignore-vuln PYSEC-2026-1325

  frontend-test:
    # Technical Implementation Plan step 8.a.ii — unit tests for
    # static/app/js/ (Vitest + jsdom, see package.json/vitest.config.js).
    # Genuinely blocked until 2026-09-11: no Node.js/npm had existed
    # anywhere in this project's history until Phil installed it via nvm
    # on his own machine specifically to unblock this step. No build step
    # for the app itself (static/app/index.html still loads plain
    # <script type="module"> tags directly) — this only adds a test
    # runner, not a bundler/compiler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  docker-build:
    # Technical Implementation Plan step 1.b.ii — was blocked until 1.d.i's
    # Dockerfile existed; it now does, so this job both closes out 1.b.ii and
    # doubles as the first real verification that Dockerfile actually builds
    # (it had only ever been written and reviewed, never run — no Docker was
    # available in the environment that wrote it). Only builds the image
    # (catches a broken Dockerfile/dependency on every push), doesn't push it
    # anywhere — Render deploys from source via its own Python buildpack
    # (see render.yaml's `env: python`), not from this image, so there's no
    # registry to publish to yet. Revisit if that ever changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t caplink:ci .
