# Render.com Blueprint — one-click deploy of the CAPLink API.
#
# Usage: on render.com, "New +" -> "Blueprint" -> point at this repo. Render
# reads this file automatically and provisions everything declared below —
# INCLUDING the `databases:` section, so applying this blueprint (or syncing
# it again after this change) is the actual "stand up a Postgres instance"
# action for step 1.a.iv. That sync is a real, manual step only you can take
# (Render dashboard access, and it may move you off the free tier depending
# on the plan chosen) — nothing in this repo can do it for you.
#
# This service is labelled ENVIRONMENT=staging, not production: it's
# Render's free tier, used for public demoing, not real institutional/
# payment data. `Settings` (app/core/config.py) confirmed 2026-08-30 as
# genuinely running on this database (not SQLite — check Render's deploy
# logs for "Context impl PostgresqlImpl" and "Running upgrade -> ...
# baseline schema" to reverify), so the SQLite-rejection validator now
# covers staging too, not just production — see
# `_reject_dev_secrets_outside_dev` in app/core/config.py.
#
# Gotcha hit while first setting this up, worth knowing before changing
# `databases:`/`envVars` again: a database's region defaults to wherever
# Render puts it if `region:` is omitted, which is NOT guaranteed to match
# an existing service's region — a mismatch breaks the internal `dpg-...`
# hostname entirely ("could not translate host name"), not just slowly.
# Separately, a `fromDatabase`-linked env var only gets (re-)resolved on an
# actual Blueprint **Sync**, not a plain "Manual Deploy" of the service —
# after recreating the database in the right region, `DATABASE_URL` here
# still pointed at the old (deleted) one's address until it was manually
# re-copied from the new database's Info page and pasted into the service's
# Environment tab directly. If a future blueprint sync doesn't pick this up
# automatically, that manual paste is the fallback.
#
# UK/EU data residency move (2026-09-11): both resources below are declared
# as `frankfurt` now (were `oregon`) — a genuine UK GDPR gap Phil decided to
# close rather than defer. Neither a database's nor (as far as could be
# confirmed without dashboard access) a web service's region can be changed
# in place on Render — both need deleting and recreating in the new region,
# same as the original Oregon setup. The free tier's one-active-database-
# at-a-time limit also means the old and new databases can't coexist even
# briefly: since staging only ever held seed/demo data (confirmed with Phil
# before doing this — nothing real was at risk), the actual sequence was
# delete-old-database, create-new-one-in-Frankfurt, no dump/restore step
# needed. If caplink-api's own region can't be edited in its Settings tab
# either, recreating it may issue a new caplink-api.onrender.com-style
# hostname — check this before assuming CORS_ORIGINS/PUBLIC_APP_URL below
# are still correct.
#
# Connection pooling (PgBouncer): Render's managed Postgres exposes a pooled
# connection string (via its own PgBouncer) alongside the direct one — check
# the database's "Connection Pooling" info in the Render dashboard once it's
# provisioned, and prefer that pooled string for DATABASE_URL over the
# direct connection string, especially once more than one web instance is
# running (avoids exhausting Postgres's own max_connections).
#
# Secrets: SECRET_KEY is generated and stored by Render itself, never in
# this file or in git — that alone is "a managed secrets store" for the one
# thing that must never leak. DATABASE_URL below is populated by Render
# itself from the database resource (`fromDatabase`), so the real connection
# string — including its password — never appears in this file or in git
# either, the same principle applied to the "DB credentials" part of step
# 1.a.ii that was blocked pending this step. STRIPE_*/FIREBASE_* use
# `sync: false`, Render's mechanism for "this service needs this var, but
# its value is set once by a human in the Render dashboard, never committed
# or templated here" — same principle as Doppler/AWS Secrets Manager, just
# Render's own built-in version of it, adequate while there's a single host.
# Firebase push is still a genuine stub either way; Stripe's *code* is real
# (Workstream 3, see README's "Payments & payroll" section) and will start
# actually charging/paying out the moment a real STRIPE_SECRET_KEY and
# STRIPE_WEBHOOK_SECRET are set here — don't set these to real values on a
# whim, since that's a real, live financial integration, not a feature flag.
# Swapping to Doppler or AWS Secrets Manager later needs no code changes:
# the app only ever reads process env vars, never cares who injected them.

databases:
  - name: caplink-staging-db
    plan: free
    region: frankfurt  # MUST match caplink-api's actual region — Render's
                  # internal networking (the DATABASE_URL below relies on
                  # it) only connects services in the same region. Omitting
                  # this let Render default the database to Ohio while
                  # caplink-api was actually in Oregon, breaking the
                  # connection entirely ("could not translate host name")
                  # until this was set explicitly and the database
                  # recreated to match. If you ever move caplink-api to a
                  # different region, this must move with it. Moved from
                  # oregon to frankfurt 2026-09-11 for UK/EU data residency
                  # — see the file header comment for the full story.
    databaseName: caplink_staging
    user: caplink_staging

services:
  - type: web
    name: caplink-api
    env: python
    region: frankfurt  # MUST match caplink-staging-db's region above — see
                  # that entry's comment for why. Previously undeclared
                  # (Render's own default, which happened to also be
                  # Oregon); made explicit alongside the frankfurt move so
                  # this can never silently drift from the database's
                  # region again.
    plan: free
    # Technical Implementation Plan step 1.b.iii — Render almost certainly
    # already defaults new git-connected services to auto-deploy on push to
    # the connected branch, but that was never actually confirmed (no Render
    # dashboard access from this workspace), so it sat as an assumption
    # rather than a documented fact. Declaring it explicitly here removes
    # the ambiguity going forward — this takes effect on the next Blueprint
    # Sync (a plain "Manual Deploy" does not re-read this file, same gotcha
    # as the DATABASE_URL note above), so it still needs that one Render
    # dashboard action to actually apply.
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt -r requirements-postgres.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: caplink-staging-db
          property: connectionString
      - key: ENVIRONMENT
        value: "staging"
      - key: CORS_ORIGINS
        value: "https://philipmcareavey.github.io"
      # Settings' own default (localhost:8000) would be wrong here — this
      # is what a registration confirmation email's link actually points
      # at (Technical Implementation Plan step 2.a.iii).
      - key: PUBLIC_APP_URL
        value: "https://caplink-api.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: HCAPTCHA_SECRET_KEY
        sync: false

