[tool.ruff]
# 135, not the default 88: this codebase deliberately favours long, descriptive
# docstrings/comments (see CLAUDE.md) over aggressive wrapping — 135 covers the
# longest existing line (131 chars) without forcing a repo-wide reformat that
# has nothing to do with catching real bugs.
line-length = 135
# Migrations are autogenerated and, once applied, shouldn't be hand-edited to
# satisfy a linter — Alembic's own long `sa.Enum(...)` column definitions
# routinely exceed any reasonable line-length.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Standard pyflakes (F) + pycodestyle errors (E) only — this is a first pass
# at CI for a codebase that's never been linted before. Deliberately NOT
# enabling flake8-bugbear (B): its B008 rule flags FastAPI's idiomatic
# `Depends(...)` in a function's default arguments as an anti-pattern, which
# is simply how FastAPI dependency injection works — 82 of the first 273
# findings here were exactly that false positive. Broader style/modernisation
# categories (UP, C4, I, RUF, ...) are a separate, deliberate decision for
# later, not something to silently inherit from ruff's larger rule sets.
select = ["E", "F"]

[tool.mypy]
python_version = "3.13"
plugins = ["sqlalchemy.ext.mypy.plugin"]
# First pass at type-checking a previously-unchecked codebase: catch real
# errors (wrong types, missing attributes) without demanding full annotation
# coverage everywhere on day one — see the CI workflow for how this is used.
ignore_missing_imports = true
